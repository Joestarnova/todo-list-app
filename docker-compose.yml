services:
    db:
      image: postgres:17
      container_name: todo-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: todo
        POSTGRES_USER: todo
        POSTGRES_PASSWORD: todo
      ports:
        - "5432:5432"
      volumes:
        - todo-pgdata:/var/lib/postgresql/data

volumes:
    todo-pgdata: