services:
      db:
        image: postgres:16
        container_name: todo-db
        restart: unless-stopped
        environment:
          POSTGRES_DB: todo
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
        ports:
          - "5432:5432"
        volumes:
          - todo-pgdata:/var/lib/postgresql/data
          - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  todo-pgdata: